name: travelos
x-backend: &backend
  image: travelos-backend:latest
  build: ./backend
  env_file: ./deploy/backend.env
  environment:
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgresql://travelos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/travelos
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelos
      POSTGRES_USER: travelos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelos -d travelos"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  migrate:
    <<: *backend
    command: ["python", "scripts/migrate_user_auth.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  backend:
    <<: *backend
    restart: unless-stopped
    volumes:
      - backend_logs:/app/.runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  frontend:
    image: travelos-frontend:latest
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
  backend_logs:
